<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ bot_name }} - Computer Science Study Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {{
    --bg: #0b0e14;
    --panel: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.10);
    --ink: #f2f4f8;
    --ink-dim: #9aa3b2;
    --a1: #4bf2a7;
    --a2: #4fd7ff;
    --radius: 16px;
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }}
  * {{ box-sizing: border-box; }}
  html, body {{ height: 100%; margin: 0; }}
  body {{
    font-family: var(--font-body);
    background: radial-gradient(80vw 60vh at 20% -10%, color-mix(in srgb, var(--a1) 16%, transparent), transparent 60%),
                radial-gradient(70vw 60vh at 100% 100%, color-mix(in srgb, var(--a2) 14%, transparent), transparent 60%),
                var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }}
  .app {{
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
  }}
  .topbar {{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px 14px;
  }}
  .brand {{ display: flex; align-items: center; gap: 12px; }}
  .mark {{
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--a1), var(--a2));
    font-size: 20px;
  }}
  .brand h1 {{
    font-family: var(--font-display);
    font-size: 20px; font-weight: 600; margin: 0;
  }}
  .tagline {{ font-size: 12px; color: var(--ink-dim); }}
  .ghost-btn {{
    background: transparent; border: 1px solid var(--line);
    color: var(--ink-dim); padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-family: var(--font-body); cursor: pointer;
    transition: border-color .2s ease, color .2s ease;
  }}
  .ghost-btn:hover {{ border-color: var(--a1); color: var(--ink); }}
  .strip {{
    display: flex; gap: 24px; overflow: hidden; padding: 6px 24px 10px;
    font-family: var(--font-display); font-size: 13px; color: var(--ink-dim);
    opacity: 0.55; white-space: nowrap;
  }}
  .chat-wrapper {{ flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 20px; }}
  .chat-window {{
    flex: 1; overflow-y: auto; padding: 10px 4px 18px;
    display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin;
  }}
  .chat-window::-webkit-scrollbar {{ width: 5px; }}
  .chat-window::-webkit-scrollbar-thumb {{ background: var(--line); border-radius: 6px; }}
  .message {{ display: flex; max-width: 84%; animation: rise .25s ease; }}
  @keyframes rise {{ from {{ opacity: 0; transform: translateY(6px); }} to {{ opacity: 1; transform: translateY(0); }} }}
  .message.bot {{ align-self: flex-start; }}
  .message.user {{ align-self: flex-end; }}
  .bubble {{
    padding: 13px 16px; border-radius: var(--radius); line-height: 1.55;
    font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
  }}
  .message.bot .bubble {{
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px); border-bottom-left-radius: 5px;
  }}
  .message.user .bubble {{
    background: linear-gradient(135deg, var(--a1), var(--a2));
    color: #0b0d12; font-weight: 500; border-bottom-right-radius: 5px;
  }}
  .typing .bubble {{ display: flex; gap: 4px; align-items: center; padding: 15px 18px; }}
  .typing .dot {{ width: 5px; height: 5px; border-radius: 50%; background: var(--ink-dim); animation: bounce 1.1s infinite ease-in-out; }}
  .typing .dot:nth-child(2) {{ animation-delay: .15s; }}
  .typing .dot:nth-child(3) {{ animation-delay: .3s; }}
  @keyframes bounce {{ 0%,60%,100% {{ transform: translateY(0); opacity:.4; }} 30% {{ transform: translateY(-4px); opacity:1; }} }}
  .input-dock {{ padding: 10px 4px 22px; }}
  .input-bar {{
    display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(18px);
  }}
  #messageInput {{
    flex: 1; resize: none; max-height: 130px; background: transparent; border: none;
    color: var(--ink); font-family: var(--font-body); font-size: 14.5px; padding: 8px 0; outline: none;
  }}
  #messageInput::placeholder {{ color: var(--ink-dim); }}
  #sendBtn {{
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--a1), var(--a2)); color: #0b0d12;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }}
  #sendBtn:hover {{ transform: translateY(-1px); }}
  #sendBtn:disabled {{ opacity: .4; cursor: not-allowed; transform: none; }}
  @media (max-width: 480px) {{
    .topbar {{ padding: 16px 14px 10px; }}
    .strip {{ display: none; }}
    .chat-wrapper {{ padding: 0 12px; }}
    .message {{ max-width: 92%; }}
  }}
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">💻</div>
        <div>
          <h1>{{{{ bot_name }}}}</h1>
          <span class="tagline">think in logic & structure</span>
        </div>
      </div>
      <button id="clearBtn" class="ghost-btn" title="Clear conversation">Clear</button>
    </header>

    <div class="strip" aria-hidden="true"><span>O(n log n)</span><span>for i in range(n)</span><span>SELECT * FROM</span><span>Stack / Queue</span><span>if / else</span></div>

    <main class="chat-wrapper">
      <div id="chatWindow" class="chat-window">
        <div class="message bot">
          <div class="bubble">Hi, I'm {{{{ bot_name }}}} 💻 Ask me any Computer Science question — I'll explain it step by step.</div>
        </div>
      </div>
      <div class="input-dock">
        <div class="input-bar">
          <textarea id="messageInput" placeholder="Ask a Computer Science question…" rows="1"></textarea>
          <button id="sendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 20L20.5 12L4 4L4 10.5L15 12L4 13.5L4 20Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

<script>
  const chatWindow = document.getElementById("chatWindow");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearBtn");

  let sessionId = localStorage.getItem("computer_science_session_id");
  if (!sessionId) {{
    sessionId = crypto.randomUUID();
    localStorage.setItem("computer_science_session_id", sessionId);
  }}

  function addMessage(text, sender) {{
    const msg = document.createElement("div");
    msg.className = `message ${{sender}}`;
    msg.innerHTML = `<div class="bubble"></div>`;
    msg.querySelector(".bubble").textContent = text;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return msg;
  }}

  function showTyping() {{
    const msg = document.createElement("div");
    msg.className = "message bot typing";
    msg.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return msg;
  }}

  async function sendMessage() {{
    const text = messageInput.value.trim();
    if (!text) return;
    addMessage(text, "user");
    messageInput.value = "";
    messageInput.style.height = "auto";
    sendBtn.disabled = true;
    const typingEl = showTyping();
    try {{
      const res = await fetch("/chat", {{
        method: "POST",
        headers: {{ "Content-Type": "application/json" }},
        body: JSON.stringify({{ message: text, session_id: sessionId }}),
      }});
      const data = await res.json();
      typingEl.remove();
      if (data.error) {{ addMessage(`⚠ ${{data.error}}`, "bot"); }}
      else {{ addMessage(data.reply, "bot"); }}
    }} catch (err) {{
      typingEl.remove();
      addMessage("⚠ Could not reach the server. Is the Flask app running?", "bot");
    }} finally {{
      sendBtn.disabled = false;
      messageInput.focus();
    }}
  }}

  sendBtn.addEventListener("click", sendMessage);
  messageInput.addEventListener("keydown", (e) => {{
    if (e.key === "Enter" && !e.shiftKey) {{ e.preventDefault(); sendMessage(); }}
  }});
  messageInput.addEventListener("input", () => {{
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 130) + "px";
  }});
  clearBtn.addEventListener("click", async () => {{
    await fetch("/reset", {{
      method: "POST",
      headers: {{ "Content-Type": "application/json" }},
      body: JSON.stringify({{ session_id: sessionId }}),
    }});
    chatWindow.innerHTML = "";
    addMessage("Cleared. What Computer Science question can I help with?", "bot");
  }});
</script>
</body>
</html>
